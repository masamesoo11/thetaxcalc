name = "thetaxcalc"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]
# NOTE: @opennextjs/cloudflare outputs Workers format to .open-next/, which
# Pages cannot deploy (static-only, no worker). scripts/build-pages-deploy.mjs
# converts it into Pages format (pages-deploy/ with _worker.js/). The build
# command in the Cloudflare Pages dashboard runs both steps, so this must
# point at the CONVERTED directory, not the raw OpenNext output.
pages_build_output_dir = "pages-deploy"

# BLOG_KV: NOT NEEDED by the current architecture (verified audit):
# - OpenNext caches are dummy (incrementalCache/tagCache dummy) - no KV ISR
# - Blog reads come from bundled JSON content (content/blog/*.json)
# - Blog writes are disabled by design: POST /api/blog returns 501 (static mode)
# - src/lib/kv-blog.ts (the only BLOG_KV consumer) was dead code from the
#   @cloudflare/next-on-pages era and has been removed.
# CONSCIOUSLY DEFERRED, not pending on a token. If a future feature needs KV,
# create an API token with KV:Edit (or bind from the dashboard), verify these
# namespace IDs still exist, then restore:
# [[kv_namespaces]]
# binding = "BLOG_KV"
# id = "b188ee44437c4909b366b47e7a6a4eee"
# preview_id = "55826597bd5c42fd9501ebec421a9d10"
