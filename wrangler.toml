name = "thetaxcalc"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]
# NOTE: @opennextjs/cloudflare outputs Workers format to .open-next/, which
# Pages cannot deploy (static-only, no worker). scripts/build-pages-deploy.mjs
# converts it into Pages format (pages-deploy/ with _worker.js/). The build
# command in the Cloudflare Pages dashboard runs both steps, so this must
# point at the CONVERTED directory, not the raw OpenNext output.
pages_build_output_dir = "pages-deploy"

# BLOG_KV binding temporarily REMOVED (2026-10-20): the CI deploy stage fails
# when it tries to bind the KV namespace. Current production runs WITHOUT the
# binding (blog pages serve built-in fallback content), so this matches live
# behavior. To re-enable: create an API token with KV:Edit (or add the binding
# from the dashboard), verify these namespace IDs exist, then restore:
# [[kv_namespaces]]
# binding = "BLOG_KV"
# id = "b188ee44437c4909b366b47e7a6a4eee"
# preview_id = "55826597bd5c42fd9501ebec421a9d10"
